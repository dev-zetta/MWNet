name: MWNet Windows and macOS candidates

on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: Existing release tag or commit to build
        required: true
        default: v1.0.0-alpha.1
        type: string
      platform:
        description: Platforms to build
        default: all
        type: choice
        options: [all, windows, macos, macos-intel, macos-arm64]

permissions:
  contents: read

jobs:
  Windows:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    uses: ./.github/workflows/windows.yml
    with:
      image: "2022"
      build-type: Release
      package: true
      source-ref: ${{ inputs.source-ref }}
  MacOS:
    if: ${{ inputs.platform != 'windows' }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.platform == 'macos-intel' && '["macos-15-intel"]' || inputs.platform == 'macos-arm64' && '["macos-15"]' || '["macos-15", "macos-15-intel"]') }}
    uses: ./.github/workflows/macos.yml
    with:
      image: ${{ matrix.image }}
      build-type: Release
      source-ref: ${{ inputs.source-ref }}

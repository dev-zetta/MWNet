name: Build and test

on:
- push
- pull_request

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  SourceChecks:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Check patch whitespace
      shell: bash
      run: |
        base="${{ github.event.pull_request.base.sha }}"
        if [[ -z "$base" ]]; then
          base="$(git rev-parse HEAD^)"
        fi
        git diff --check "$base"...HEAD

    - name: Check CMake formatting
      run: CI/check_cmake_format.sh

    - name: Check TES3MP 0.8.1 Lua API compatibility
      run: CI/check_tes3mp_lua_api.sh

    - name: Generate SPDX SBOM
      run: python3 CI/generate_spdx_sbom.py --output build-metadata/tes3mp.spdx.json

    - name: Retain SPDX SBOM
      uses: actions/upload-artifact@v6
      with:
        name: tes3mp-source-sbom-${{ github.sha }}
        path: build-metadata/tes3mp.spdx.json

  ProtocolLinux:
    name: protocol-${{ matrix.compiler }}-${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - compiler: gcc
          cc: gcc
          cxx: g++
          sanitizer: none
          flags: ""
        - compiler: clang
          cc: clang
          cxx: clang++
          sanitizer: none
          flags: ""
        - compiler: clang
          cc: clang
          cxx: clang++
          sanitizer: asan-ubsan
          flags: -fsanitize=address,undefined -fno-omit-frame-pointer
        - compiler: clang
          cc: clang
          cxx: clang++
          sanitizer: tsan
          flags: -fsanitize=thread -fno-omit-frame-pointer

    steps:
    - uses: actions/checkout@v6
    - name: Configure protocol tests
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
      run: >
        cmake -S . -B build-protocol
        -D TES3MP_TESTS_ONLY=ON
        -D CMAKE_BUILD_TYPE=Debug
        -D CMAKE_CXX_FLAGS="${{ matrix.flags }}"
        -D CMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}"
    - name: Build protocol tests
      run: cmake --build build-protocol --parallel 2
    - name: Run protocol tests
      run: ctest --test-dir build-protocol --output-on-failure

  ProtocolMSVC:
    name: protocol-msvc
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
    - uses: ilammy/msvc-dev-cmd@v1
    - name: Configure protocol tests
      run: cmake -S . -B build-protocol -D TES3MP_TESTS_ONLY=ON
    - name: Build protocol tests
      run: cmake --build build-protocol --config Debug --parallel 2
    - name: Run protocol tests
      run: ctest --test-dir build-protocol -C Debug --output-on-failure

  FuzzSmoke:
    name: protocol-fuzz-smoke
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Configure fuzz smoke targets
      env:
        CC: clang
        CXX: clang++
      run: >
        cmake -S . -B build-fuzz
        -D TES3MP_TESTS_ONLY=ON
        -D BUILD_TES3MP_FUZZERS=ON
        -D CMAKE_BUILD_TYPE=Debug
    - name: Build fuzz smoke targets
      run: >
        cmake --build build-fuzz
        --target tes3mp-packet-fuzz tes3mp-transport-fuzz
        --parallel 2
    - name: Run protocol codec fuzzer
      run: |
        mkdir -p fuzz-corpus/packet fuzz-artifacts/packet
        build-fuzz/apps/tes3mp_fuzz/tes3mp-packet-fuzz \
          -runs=10000 -artifact_prefix=fuzz-artifacts/packet/ fuzz-corpus/packet
    - name: Run transport codec fuzzer
      run: |
        mkdir -p fuzz-corpus/transport fuzz-artifacts/transport
        build-fuzz/apps/tes3mp_fuzz/tes3mp-transport-fuzz \
          -runs=10000 -artifact_prefix=fuzz-artifacts/transport/ fuzz-corpus/transport
    - name: Retain fuzz inputs and failures
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: tes3mp-fuzz-smoke-${{ github.sha }}
        path: |
          fuzz-corpus
          fuzz-artifacts

  Ubuntu:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Add OpenMW PPA Dependencies
      run: sudo add-apt-repository ppa:openmw/openmw; sudo apt-get update

    - name: Install Building Dependencies
      run: sudo CI/install_debian_deps.sh gcc openmw-deps openmw-deps-dynamic

    - name: Prime ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ${{ matrix.os }}-${{ env.BUILD_TYPE }}
        max-size: 1000M

    - name: Configure
      run: >
        cmake -S . -B build
        -D CMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -D OPENMW_USE_SYSTEM_RECASTNAVIGATION=ON
        -D USE_SYSTEM_TINYXML=ON
        -D BUILD_COMPONENTS_TESTS=ON
        -D BUILD_OPENMW_TESTS=ON
        -D BUILD_OPENCS_TESTS=ON
        -D BUILD_TES3MP_TESTS=ON
        -D TES3MP_FETCH_DEPS=ON
        -D CMAKE_INSTALL_PREFIX=install

    - name: Build
      run: cmake --build build --parallel $(nproc)

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

    - name: Configure dedicated-server-only build
      run: >
        cmake -S . -B build-server
        -D CMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -D BUILD_OPENMW=OFF
        -D BUILD_OPENMW_MP=ON
        -D BUILD_OPENCS=OFF
        -D BUILD_LAUNCHER=OFF
        -D BUILD_WIZARD=OFF
        -D BUILD_MWINIIMPORTER=OFF
        -D BUILD_ESSIMPORTER=OFF
        -D BUILD_BSATOOL=OFF
        -D BUILD_ESMTOOL=OFF
        -D BUILD_NIFTEST=OFF
        -D BUILD_NAVMESHTOOL=OFF
        -D BUILD_BULLETOBJECTTOOL=OFF
        -D BUILD_TES3MP_TESTS=ON
        -D TES3MP_FETCH_DEPS=ON

    - name: Build dedicated server and protocol tests
      run: cmake --build build-server --target tes3mp-server tes3mp-tests --parallel $(nproc)

    - name: Run dedicated-server-only tests
      run: ctest --test-dir build-server --output-on-failure

    - name: Capture protocol 11 performance sample
      run: >
        build-server/tes3mp-headless-integration
        --cycles 10
        --clients 2
        --packet-loss-percent 2
        --metrics-output build-metadata/tes3mp-performance.json
        --commit ${{ github.sha }}

    - name: Retain protocol 11 performance sample
      uses: actions/upload-artifact@v6
      with:
        name: tes3mp-performance-${{ github.sha }}
        path: build-metadata/tes3mp-performance.json

    # - name: Install

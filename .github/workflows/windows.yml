name: Reusable Windows workflow

on:
  workflow_call:
    inputs:
      source-ref:
        description: Source tag or commit; defaults to the workflow revision
        default: ""
        type: string
      image:
        description: Window Server image
        required: true
        type: string
      msvc:
        description: MSVC version (2022/2026)
        default: "2022"
        type: string
      build-type:
        default: RelWithDebInfo
        type: string
      package:
        default: false
        type: boolean
      release:
        default: false
        type: boolean

jobs:
  Windows:
    name: windows-${{ inputs.image }}

    runs-on: windows-${{ inputs.image }}

    env:
      archive: FAILEDTODOWNLOAD
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/deps/vcpkg-binary-cache,readwrite

    steps:
    - name: Install NSIS
      if: ${{ inputs.package }}
      run: choco install nsis

    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.source-ref }}

    - name: Fetch package validation tooling
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        path: release-tools
        sparse-checkout: |
          CI/smoke_mwnet_package.py
          CI/complete_boost_headers.py
          CI/test_mwnet_windows_io.py
        sparse-checkout-cone-mode: false

    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - shell: bash
      name: Add deps version env to GITHUB_ENV, stripping comments
      run: |
        sed '/^\s*#/d; /^\s*$/d' "${{ github.workspace }}/CI/deps_versions.msvc.sh" >> $GITHUB_ENV

    - name: Create directories for dependencies
      run: |
        mkdir -p ${{ github.workspace }}/deps
        mkdir -p ${{ github.workspace }}/deps/Qt

    - name: Download prebuilt vcpkg packages
      working-directory: ${{ github.workspace }}/deps
      run: |
        $MANIFEST = "vcpkg-x64-windows-${{ inputs.msvc }}-${{ env.VCPKG_TAG }}-manifest.txt"
        curl --fail --retry 3 -L -o "$MANIFEST" "https://gitlab.com/OpenMW/openmw-deps/-/raw/main/windows/$MANIFEST"
        $lines = Get-Content "$MANIFEST"
        $URL = $lines[0]
        $split = -split $lines[1]
        $HASH = $split[0]
        $FILE = $split[1]
        curl --fail --retry 3 -L -o "$FILE" "$URL"
        $filehash = Get-FileHash "$FILE" -Algorithm SHA512
        if ( $filehash.hash -ne "$HASH" ) {
          exit 1
        }
        echo "archive=$FILE" >> $env:GITHUB_ENV

    - name: Extract archived prebuilt vcpkg packages
      working-directory: ${{ github.workspace }}/deps
      run: 7z x -y -ovcpkg-x64-windows-${{ inputs.msvc }}-${{ env.VCPKG_TAG }} $env:archive

    - name: Check Windows UTF-8 JSON file access
      run: python release-tools/CI/test_mwnet_windows_io.py "deps/vcpkg-x64-windows-${{ inputs.msvc }}-${{ env.VCPKG_TAG }}/installed/x64-windows/bin/lua51.dll"

    # The OpenMW archive is an exported SDK, without ports or triplet definitions.
    - name: Fetch pinned vcpkg package manager
      uses: actions/checkout@v6
      with:
        repository: microsoft/vcpkg
        ref: e0edebd1dc2d03cf7d02349df91de74ef4d0c00e
        path: deps/vcpkg-tools

    - name: Restore compiled transport dependencies
      id: transport-cache
      uses: actions/cache/restore@v5
      with:
        path: deps/vcpkg-binary-cache
        key: mwnet-vcpkg-${{ inputs.msvc }}-2026-02-27-v2
        restore-keys: mwnet-vcpkg-${{ inputs.msvc }}-2026-02-27-

    - name: Install MWNet transport dependencies
      working-directory: ${{ github.workspace }}/deps/vcpkg-tools
      run: |
        .\bootstrap-vcpkg.bat -disableMetrics
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        .\vcpkg.exe install libsodium:x64-windows protobuf:x64-windows openssl:x64-windows curl:x64-windows sqlite3:x64-windows --x-install-root="${{ github.workspace }}/deps/vcpkg-x64-windows-${{ inputs.msvc }}-${{ env.VCPKG_TAG }}/installed"

    - name: Save compiled transport dependencies
      if: steps.transport-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: deps/vcpkg-binary-cache
        key: ${{ steps.transport-cache.outputs.cache-primary-key }}

    - name: Complete Boost headers
      run: python release-tools/CI/complete_boost_headers.py "deps/vcpkg-x64-windows-${{ inputs.msvc }}-${{ env.VCPKG_TAG }}/installed/x64-windows"

    - name: Cache Qt
      id: qt-cache
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/deps/Qt/${{ env.QT_VER }}/msvc2019_64
        key: qt-cache-${{ env.QT_VER }}-msvc2019_64-v1

    - name: Download aqt
      if: steps.qt-cache.outputs.cache-hit != 'true'
      working-directory: ${{ github.workspace }}/deps/Qt
      run: >
        curl --fail --retry 3 -L
        -o aqt_x64.exe
        https://github.com/miurahr/aqtinstall/releases/download/v3.1.15/aqt_x64.exe

    - name: Install Qt with aqt
      if: steps.qt-cache.outputs.cache-hit != 'true'
      working-directory: ${{ github.workspace }}/deps/Qt
      run: .\aqt_x64.exe install-qt windows desktop ${{ env.QT_VER }} win64_msvc2019_64

    - uses: ilammy/msvc-dev-cmd@v1

    - uses: seanmiddleditch/gha-setup-ninja@master

    - name: Configure OpenMW
      run: >
        cmake
        -S .
        -B ${{ github.workspace }}/build
        -G Ninja
        -D CMAKE_BUILD_TYPE=${{ inputs.build-type }}
        -D CMAKE_TOOLCHAIN_FILE='${{ github.workspace }}/deps/vcpkg-x64-windows-${{ inputs.msvc }}-${{ env.VCPKG_TAG }}/scripts/buildsystems/vcpkg.cmake'
        -D CMAKE_PREFIX_PATH='${{ github.workspace }}/deps/Qt/${{ env.QT_VER }}/msvc2019_64'
        ${{ inputs.package && '-D CMAKE_CXX_FLAGS_RELEASE="/O2 /Ob2 /DNDEBUG"' || '' }}
        ${{ inputs.package && '-D "CMAKE_EXE_LINKER_FLAGS_RELEASE=/DEBUG /OPT:REF /OPT:ICF /INCREMENTAL:NO"' || '' }}
        -D LuaJit_INCLUDE_DIR='${{ github.workspace }}/deps/vcpkg-x64-windows-${{ inputs.msvc }}-${{ env.VCPKG_TAG }}/installed/x64-windows/include/luajit'
        -D LuaJit_LIBRARY='${{ github.workspace }}/deps/vcpkg-x64-windows-${{ inputs.msvc }}-${{ env.VCPKG_TAG }}/installed/x64-windows/lib/lua51.lib'
        -D BUILD_BENCHMARKS=${{ ! inputs.package }}
        -D BUILD_COMPONENTS_TESTS=${{ ! inputs.package }}
        -D BUILD_OPENMW_TESTS=${{ ! inputs.package }}
        -D BUILD_OPENCS_TESTS=${{ ! inputs.package }}
        -D OPENMW_USE_SYSTEM_SQLITE3=OFF
        -D OPENMW_USE_SYSTEM_YAML_CPP=OFF
        -D OPENMW_LTO_BUILD=OFF
        -D MWNET_FETCH_DEPS=ON
        -D BUILD_MWNET_TESTS=ON
        -D CMAKE_POLICY_DEFAULT_CMP0141=NEW
        -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=ProgramDatabase
        ${{ inputs.package && '-D "VCREDIST64=$env:VCToolsRedistDir/vc_redist.x64.exe"' || '' }}
        -D CMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Build multiplayer test targets
      run: cmake --build ${{ github.workspace }}/build --target mwnet-tests mwnet-headless-integration mwnet-persistence-fault mwnet-discovery-tests

    - name: Check multiplayer test targets before the full build
      run: ctest --test-dir build --output-on-failure -R "^mwnet-(unit|headless|persistence-fault|discovery)$"

    - name: Build OpenMW
      run: cmake --build ${{ github.workspace }}/build

    - name: Copy missing DLLs
      run: |
        cp ${{ github.workspace }}/deps/vcpkg-x64-windows-${{ inputs.msvc }}-${{ env.VCPKG_TAG }}/installed/x64-windows/bin/Release/MyGUIEngine.dll ${{ github.workspace }}/build
        cp -Filter *.dll -Recurse ${{ github.workspace }}/deps/vcpkg-x64-windows-${{ inputs.msvc }}-${{ env.VCPKG_TAG }}/installed/x64-windows/bin/osgPlugins-3.6.5 ${{ github.workspace }}/build
        cp ${{ github.workspace }}/deps/vcpkg-x64-windows-${{ inputs.msvc }}-${{ env.VCPKG_TAG }}/installed/x64-windows/bin/*.dll ${{ github.workspace }}/build

    - name: Copy Qt DLLs
      working-directory: ${{ github.workspace }}/deps/Qt/${{ env.QT_VER }}/msvc2019_64
      run: |
        cp bin/Qt6Core.dll ${{ github.workspace }}/build
        cp bin/Qt6Gui.dll ${{ github.workspace }}/build
        cp bin/Qt6Network.dll ${{ github.workspace }}/build
        cp bin/Qt6OpenGL.dll ${{ github.workspace }}/build
        cp bin/Qt6OpenGLWidgets.dll ${{ github.workspace }}/build
        cp bin/Qt6Widgets.dll ${{ github.workspace }}/build
        cp bin/Qt6Svg.dll ${{ github.workspace }}/build
        mkdir ${{ github.workspace }}/build/styles
        cp plugins/styles/qwindowsvistastyle.dll ${{ github.workspace }}/build/styles
        mkdir ${{ github.workspace }}/build/platforms
        cp plugins/platforms/qwindows.dll ${{ github.workspace }}/build/platforms
        mkdir ${{ github.workspace }}/build/imageformats
        cp plugins/imageformats/qsvg.dll ${{ github.workspace }}/build/imageformats
        mkdir ${{ github.workspace }}/build/iconengines
        cp plugins/iconengines/qsvgicon.dll ${{ github.workspace }}/build/iconengines

    - name: Create symbol server directory structure
      working-directory: ${{ github.workspace }}/build
      run: |
        ${{ github.workspace }}\CI\Store-Symbols.ps1
        Move-Item ${{ github.workspace }}\build\SymStore ${{ github.workspace }}

    - name: Move pdb files
      run: |
        robocopy build pdb *.pdb /MOVE
        if ($lastexitcode -lt 8) {
          $global:LASTEXITCODE = $null
        }

    - name: Install OpenMW
      if: ${{ ! inputs.package }}
      run: cmake --install ${{ github.workspace }}/build --prefix ${{ github.workspace }}/install

    - name: Include the dedicated server and CoreScripts in Windows packages
      if: ${{ inputs.package }}
      shell: bash
      run: |
        source_dir="$(pwd -W)"
        cat >> build/cmake_install.cmake <<EOF
        file(INSTALL DESTINATION "\${CMAKE_INSTALL_PREFIX}" TYPE PROGRAM FILES "$source_dir/build/mwnet-server.exe")
        file(INSTALL DESTINATION "\${CMAKE_INSTALL_PREFIX}/server" TYPE DIRECTORY FILES "$source_dir/files/mwnet/core-scripts/")
        file(INSTALL DESTINATION "\${CMAKE_INSTALL_PREFIX}/server/data" TYPE FILE FILES "$source_dir/files/mwnet/core-scripts/defaults/banlist.json" "$source_dir/files/mwnet/core-scripts/defaults/requiredDataFiles.json")
        foreach(directory cell custom map player recordstore world)
          file(MAKE_DIRECTORY "\${CMAKE_INSTALL_PREFIX}/server/data/\${directory}")
        endforeach()
        EOF

    - name: Package MWNet
      if: ${{ inputs.package }}
      run: |
        cpack --config "${{ github.workspace }}/build/CPackConfig.cmake" -B "${{ github.workspace }}/install"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cpack -G ZIP --config "${{ github.workspace }}/build/CPackConfig.cmake" -B "${{ github.workspace }}/install"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        rm -r -Force "${{ github.workspace }}/install/_CPack_Packages"

    - name: Run multiplayer tests
      run: ctest --test-dir build --output-on-failure

    - name: Verify portable package
      if: ${{ inputs.package }}
      run: |
        $archive = Get-ChildItem install/MWNet-*.zip | Select-Object -First 1
        Expand-Archive $archive.FullName package-smoke
        $client = Get-ChildItem package-smoke -Recurse -Filter mwnet.exe | Select-Object -First 1
        if (-not $client) { throw "Packaged client is missing" }
        $root = $client.Directory.FullName
        foreach ($required in @('mwnet-server.exe', 'server/scripts/serverCore.lua', 'mwnet-server-default.cfg')) {
          if (-not (Test-Path "$root/$required")) { throw "Missing package file: $required" }
        }
        $revision = git rev-parse HEAD
        python release-tools/CI/smoke_mwnet_package.py $root --commit $revision

    - name: Remove extra pdb files
      if: ${{ ! inputs.package }}
      shell: bash
      run: |
        rm -rf install/bin
        rm -rf install/_deps

    - name: Generate CI-ID.txt
      shell: bash
      run: |
        source_commit=$(git rev-parse HEAD)
        printf 'Source commit %s\nBuild https://github.com/%s/actions/runs/%s\n' \
          "$source_commit" '${{ github.repository }}' '${{ github.run_id }}' > install/CI-ID.txt
        cp install/CI-ID.txt pdb/CI-ID.txt
        cp install/CI-ID.txt SymStore/CI-ID.txt

    - name: Store OpenMW archived pdb files
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: openmw-windows-${{ inputs.msvc }}-pdb-${{ github.sha }}
        path: ${{ github.workspace }}/pdb/*

    - name: Store OpenMW build artifacts
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: openmw-windows-${{ inputs.msvc }}-${{ github.sha }}
        path: ${{ github.workspace }}/install/*

    - name: Store symbol server artifacts
      uses: actions/upload-artifact@v6
      with:
        name: openmw-windows-${{ inputs.msvc }}-sym-store-${{ github.sha }}
        path: ${{ github.workspace }}/SymStore/*

    - name: Store log etc. artifacts
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: openmw-windows-${{ inputs.msvc }}-logs-and-stuff-${{ github.sha }}
        path: |
          ${{ github.workspace }}/build/compile_commands.json
          ${{ github.workspace }}/build/**/*.log
          ${{ github.workspace }}/build/**/*.ninja_log
          ${{ github.workspace }}/build/**/CMakeCache.txt

    - name: Upload to symbol server
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: eu-west-3
      if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && inputs.package }}
      working-directory: ${{ github.workspace }}/SymStore
      run: |
        choco uninstall awscli -y
        choco install awscli -y --version=2.22.35
        aws --version
        aws --endpoint-url https://rgw.ctrl-c.liu.se s3 sync --size-only --exclude * --include *.ex_ --include *.dl_ --include *.pd_ . s3://openmw-sym

    - name: Add install directory to PATH
      shell: bash
      run: echo '${{ github.workspace }}/install' >> ${GITHUB_PATH}

    - name: Run components tests
      if: ${{ ! inputs.package }}
      run: build/components-tests.exe

    - name: Run OpenMW tests
      if: ${{ ! inputs.package }}
      run: build/openmw-tests.exe

    - name: Run OpenMW-CS tests
      if: ${{ ! inputs.package }}
      run: build/openmw-cs-tests.exe

    - name: Run detournavigator navmeshtilescache benchmark
      if: ${{ ! inputs.package }}
      run: build/openmw_detournavigator_navmeshtilescache_benchmark.exe

    - name: Run settings access benchmark
      if: ${{ ! inputs.package }}
      run: build/openmw_settings_access_benchmark.exe

    - name: Run esm refid benchmark
      if: ${{ ! inputs.package }}
      run: build/openmw_esm_refid_benchmark.exe

    - name: Create prerelease
      if: ${{ inputs.release }}
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ github.workspace }}/install/*.exe
        prerelease: true
        draft: true

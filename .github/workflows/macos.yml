name: Reusable MacOS workflow

on:
  workflow_call:
    inputs:
      source-ref:
        description: Source tag or commit; defaults to the workflow revision
        default: ""
        type: string
      release:
        description: Create a draft release from the package
        default: false
        type: boolean
      build-type:
        default: RelWithDebInfo
        type: string
      image:
        description: MacOS Runner image
        required: true
        type: string

jobs:
  MacOS:
    name: ${{ inputs.image }}
    runs-on: ${{ inputs.image }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      HOMEBREW_NO_INSTALL_UPGRADE: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.source-ref }}
    - name: Fetch package validation tooling
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        path: release-tools
        sparse-checkout: |
          CI/smoke_mwnet_package.py
          CI/complete_boost_headers.py
        sparse-checkout-cone-mode: false
    - name: Select the C++20 toolchain
      run: |
        sudo xcode-select --switch "$DEVELOPER_DIR"
        xcrun clang++ --version
    - run: echo "CMAKE_BUILD_TYPE=${{ inputs.build-type }}" >> $GITHUB_ENV

    - run: echo "MACOS_AMD64=true" >> $GITHUB_ENV
      if: ${{ inputs.image == 'macos-15-intel' }}

    - run: echo "DMG_IDENTIFIER=x86_64" >> $GITHUB_ENV
      if: ${{ inputs.image == 'macos-15-intel' }}
    - run: echo "DMG_IDENTIFIER=arm64" >> $GITHUB_ENV
      if: ${{ inputs.image != 'macos-15-intel' }}

    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Cache Qt SDK
      id: qt-cache
      uses: actions/cache@v5
      with:
        path: deps/Qt
        key: qt-6.10.3-macos-universal-v1

    - name: Install Qt SDK
      if: steps.qt-cache.outputs.cache-hit != 'true'
      run: |
        python -m pip install aqtinstall==3.3.0
        python -m aqt install-qt mac desktop 6.10.3 clang_64 --outputdir deps/Qt --archives qtbase qttools qtsvg qttranslations

    - name: Add Qt tools to PATH
      run: echo "$PWD/deps/Qt/6.10.3/macos/bin" >> "$GITHUB_PATH"

    - name: Install building dependencies
      run: |
        brew install libsodium protobuf curl
        command -v 7z >/dev/null || brew install p7zip
        source CI/macos/deps_versions.sh
        if [[ -n "${MACOS_AMD64:-}" ]]; then
          sdk=vcpkg-x64-osx-dynamic
        else
          sdk=vcpkg-arm64-osx-dynamic
        fi
        curl --fail --location --retry 3 \
          "https://gitlab.com/OpenMW/openmw-deps/-/raw/main/macos/${sdk}-${VCPKG_TAG}-manifest.txt" \
          -o "$RUNNER_TEMP/openmw-manifest.txt"
        { read -r url && read -r checksum filename; } < "$RUNNER_TEMP/openmw-manifest.txt"
        curl --fail --location --retry 3 "$url" -o "$RUNNER_TEMP/$filename"
        (cd "$RUNNER_TEMP"; printf '%s  %s\n' "$checksum" "$filename" | shasum -a 512 --check)
        7z x -y -o/tmp/openmw-deps-pre "$RUNNER_TEMP/$filename"
        mv /tmp/openmw-deps-pre/*/ /tmp/openmw-deps/
        if [[ -n "${MACOS_AMD64:-}" ]]; then
          triplet=x64-osx-dynamic
        else
          triplet=arm64-osx-dynamic
        fi
        python release-tools/CI/complete_boost_headers.py "/tmp/openmw-deps/installed/$triplet"

    - name: Prime ccache
      uses: hendrikmuhs/ccache-action@v1.2.22
      with:
        key: ${{ inputs.image }}-${{ inputs.build-type }}
        max-size: 1000M

    - name: Configure
      run: CI/before_script.macos.sh -C
    - name: Enable multiplayer tests and include server configuration
      run: |
        cmake -S . -B build -DBUILD_MWNET_TESTS=ON
        cp build/mwnet-client-default.cfg build/mwnet-server-default.cfg build/MWNet.app/Contents/Resources/
        cp -R files/mwnet/core-scripts build/MWNet.app/Contents/Resources/server
        cp files/mwnet/core-scripts/defaults/*.json build/MWNet.app/Contents/Resources/server/data/
        mkdir -p build/MWNet.app/Contents/Resources/server/data/{cell,custom,map,player,recordstore,world}
    - name: Check macOS framework dependencies before compiling
      shell: python
      run: |
        from pathlib import Path
        link = Path('build/apps/launcher/CMakeFiles/openmw-launcher.dir/link.txt').read_text()
        if '-framework AGL' in link:
            print(link)
            for root in (Path('/tmp/openmw-deps'), Path('deps/Qt')):
                for pattern in ('*.cmake', '*.prl'):
                    for path in root.rglob(pattern):
                        for number, line in enumerate(path.read_text(errors='replace').splitlines(), 1):
                            if 'AGL' in line:
                                print(f'{path}:{number}: {line}')
            raise RuntimeError('Dependency SDK still references the removed AGL framework')
    - name: Build
      run: CI/macos/build.sh

    - name: Run multiplayer tests
      run: ctest --test-dir build --output-on-failure

    - name: Verify packaged client and server
      run: |
        mkdir package-smoke
        hdiutil attach build/MWNet-*.dmg -mountpoint "$PWD/package-smoke" -nobrowse
        trap 'hdiutil detach "$PWD/package-smoke"' EXIT
        test -x package-smoke/MWNet.app/Contents/MacOS/mwnet-server
        test -f package-smoke/MWNet.app/Contents/Resources/server/scripts/serverCore.lua
        python release-tools/CI/smoke_mwnet_package.py package-smoke/MWNet.app --commit "$(git rev-parse HEAD)"

    - name: Store dmg
      uses: actions/upload-artifact@v6
      with:
        name: openmw-macos-dmg-${{ env.DMG_IDENTIFIER }}-${{ github.sha }}
        path: |
          ${{ github.workspace }}/build/MWNet-*.dmg

    - name: Create prerelease
      if: ${{ inputs.release }}
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ github.workspace }}/build/MWNet-*.dmg
        prerelease: true
        draft: true

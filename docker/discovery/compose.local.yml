# Isolated local fixture. No game traffic is exposed to the host; HTTPS is
# published only on loopback. The test runner owns/restarts its directory.
services:
  test:
    image: tes3mp-directory:test
    build:
      context: ../..
      dockerfile: docker/discovery/Dockerfile
      target: test
    entrypoint: ["sleep", "infinity"]
    ports: ["127.0.0.1:8443:8443"]
    volumes: ["test-data:/data"]
    mem_limit: 512m
    cpus: 2
    pids_limit: 96
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck: {disable: true}
    logging: &logs
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  https:
    image: caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    network_mode: service:test
    depends_on: [test]
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - test-ca:/data
      - test-caddy-config:/config
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 128m
    cpus: 1
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logs
volumes:
  test-data:
  test-ca:
  test-caddy-config:

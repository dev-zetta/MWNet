# Separate project: restarting the directory must not stop its ingress agent.
# Verified stable 1.1.0; updating this digest is an explicit operator action.
# The agent image is downloaded explicitly; it is not bundled into the ISO.
services:
  playit:
    image: ghcr.io/playit-cloud/playit-agent:1.1.0@sha256:fa2a6c58815582371fe046f0bd8bea6a39a8684711594a9d2dbe03e44df1fa2c
    network_mode: host
    env_file:
      - path: ${PLAYIT_ENV_FILE:-/etc/playit/agent.env}
        format: raw
        required: true
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

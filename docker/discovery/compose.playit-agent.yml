# Separate project: restarting the directory must not stop its ingress agent.
# This pins the verified 1.0 image used by the current NUC setup (1.0.12).
# The agent image is downloaded explicitly; it is not bundled into the ISO.
services:
  playit:
    image: ghcr.io/playit-cloud/playit-agent:1.0@sha256:5b7748d3e8564f1cac3d3a295a23640136fbf774c76a9509bd262d16b324b06b
    network_mode: host
    env_file:
      - path: ${PLAYIT_ENV_FILE:-/etc/playit/agent.env}
        format: raw
        required: true
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

[General]
# Alpha servers bind only to loopback by default. Set an explicit non-loopback
# address only after reviewing the security and firewall implications.
localAddress = 127.0.0.1
# Required for every non-loopback localAddress.
publicListen = false
port = 25565
maximumPlayers = 64
hostname = TES3MP server
# 0 - Verbose (spam), 1 - Info, 2 - Warnings, 3 - Errors, 4 - Only fatal errors
logLevel = 1
# Optional libsodium Argon2id encoded hash for the server-wide access password.
# Generate this with the dedicated server password-hash command; plaintext
# access passwords are not accepted in configuration files.
passwordHash =

[Plugins]
home = ./server
plugins = serverCore.lua

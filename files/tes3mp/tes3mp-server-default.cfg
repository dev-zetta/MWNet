[General]
# Alpha servers bind only to loopback by default. Set an explicit non-loopback
# address only after reviewing the security and firewall implications.
localAddress = 127.0.0.1
# Required for every non-loopback localAddress.
publicListen = false
port = 25565
maximumPlayers = 64
hostname = TES3MP server
# 0 - Verbose (spam), 1 - Info, 2 - Warnings, 3 - Errors, 4 - Only fatal errors
logLevel = 1
# Optional libsodium Argon2id encoded hash for the server-wide access password.
# Generate this with the dedicated server password-hash command; plaintext
# access passwords are not accepted in configuration files.
passwordHash =

[Security]
# Absolute server-owned movement ceiling in game units per second. Character-
# specific mechanics may lower this bound; values above it are never accepted.
movementMaximumSpeed = 2000
# Disconnect after this many rejected movement samples.
movementViolationLimit = 5

[Content]
# Canonical spell resolution requires the server to load the same ordered ESM
# content as its clients. Leave data empty only for protocol-only test servers.
data =
files = Morrowind.esm
encoding = win1252
maximumTouchRange = 192
maximumTargetRange = 8192

[Plugins]
home = ./server
plugins = serverCore.lua

[AI]
# Recover moving NPCs stalled for 20 seconds to nearby content-defined positions.
actorRecoveryEnabled = true

[Discovery]
# Set to the new directory HTTPS origin when deployed. No legacy fallback.
directoryUrl =
# Optional additional CA file for a locally trusted test deployment.
caFile =
announce = false
# Isolated loopback HTTPS/game endpoints only; never enable for public deployment.
localTest = false
# Globally routable numeric IP; DNS names remain supported for direct connect.
publicAddress =
publicPort = 25565

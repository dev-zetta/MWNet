[General]
destinationAddress = localhost
port = 25565
accountName =
# 0 - Verbose (spam), 1 - Info, 2 - Warnings, 3 - Errors, 4 - Only fatal errors
logLevel = 0

[Chat]
# Use https://wiki.libsdl.org/SDL_Keycode to find the correct key codes when rebinding
#
# For chatting
keySay = Y
# For enabling or disabling the chat window
keyChatMode = F2
x = 0
y = 0
w = 390
h = 250
# How long the message will be displayed in hidden mode
delay = 5.0

[Discovery]
# Set to the new directory HTTPS origin when deployed. No legacy fallback.
directoryUrl =
# Optional additional CA file for a locally trusted test deployment.
caFile =
